[package]
name = "m-ftracert"
version = "0.1.0"
description = "M-FTracert - A Frida script generator for Java method tracing"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "dialog-message", "dialog-confirm", "dialog-ask", "protocol-asset", "shell-open", "fs-read-file", "fs-write-file", "fs-create-dir", "process-exit", "process-relaunch", "shell-execute", "shell-sidecar"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
subprocess = "0.2"
which = "4.4"
encoding_rs = "0.8"
dirs = "5.0"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
